name: phantom-pre-install
on: [push, pull_request]
jobs:
  schemas-python-ev3-host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/protocolgen.py --check && python3 tools/configgen.py --check
      - run: python3 tools/test_protocol.py && python3 sim/ev3-simulator/test_simulator.py && python3 sim/tracking-replay/test_tracking_replay.py
      - run: python3 tools/security_scan.py
      - run: cmake -S ev3 -B build/ev3-host -G Ninja -DCMAKE_BUILD_TYPE=Debug && cmake --build build/ev3-host && ctest --test-dir build/ev3-host --output-on-failure
      - run: cmake -S ev3 -B build/ev3-sanitize -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' && cmake --build build/ev3-sanitize && ASAN_OPTIONS=detect_leaks=1 ctest --test-dir build/ev3-sanitize --output-on-failure
  armel-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned ev3dev Stretch cross image
        run: docker pull ev3dev/debian-stretch-cross@sha256:819ea7442bbe109d2b39c6c7766e7d1fe635bb98b86c4f6c3b636c0ce176a29f
      - name: Build ARMv5TEJ armel artifacts in pinned image
        run: |
          mkdir -p "$RUNNER_TEMP/phantom-ev3-armel"
          for profile in Release Diagnostic; do
            out="$RUNNER_TEMP/phantom-ev3-armel/$(echo "$profile" | tr A-Z a-z)"
            mkdir -p "$out"
            docker run --rm --entrypoint sh \
              -v "$PWD:/workspace:ro" -v "$out:/out" \
              ev3dev/debian-stretch-cross@sha256:819ea7442bbe109d2b39c6c7766e7d1fe635bb98b86c4f6c3b636c0ce176a29f \
              /workspace/scripts/ev3-armel-build /out "$profile"
          done
