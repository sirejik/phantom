name: phantom-test-and-build
# No device deployment; Unity licensing and the Editor build are separate prerequisites.
on: [push, pull_request]
jobs:
  checks-and-host-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: PhantomQuest/Tests/Host/global.json
      - name: Documentation, schemas and secrets
        run: |
          python tooling check --target docs
          python tooling check --target schemas
          python tooling check --target security
      - name: Tooling regressions
        run: python tooling self-test
      - name: EV3 C++ host tests
        run: python tooling test --target ev3
      - name: EV3 host sanitizers
        run: python tooling test --target ev3 --sanitize
      - name: Quest CSharp unit and functional tests
        run: python tooling test --target quest --suite host
  armel-cross:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch the pinned image
        run: |
          image=$(python -c "import json; x=json.load(open('config/ev3/toolchain.json')); print(x['cross_image']+'@'+x['cross_image_digest'])")
          docker pull "$image"
      - name: Build and validate Diagnostic ARM package
        run: python tooling build --target ev3 --profile diagnostic
